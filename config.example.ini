# =========================================================================== #
# DVR -> YouTube Live Template Configuration
# Copy this file to 'config.ini' and fill in your details.
# Keep config.ini private: it holds your DVR password and YouTube stream key.
# =========================================================================== #

[dvr]
# IP address or hostname of your Hikvision / Dahua / ONVIF DVR or NVR
host     = 192.168.0.17
# RTSP port (default: 554)
port     = 554
username = admin
# Plain text password. Special characters (like '@') are automatically URL-encoded.
password = YourDvrPasswordHere
# Total number of camera channels on your DVR
channels = 8
# Stream type: 'main' = full resolution (e.g. 1080p/4K) | 'sub' = lower resolution (e.g. 360p/720p)
stream   = main

[youtube]
# Your 16-24 character YouTube Live stream key from YouTube Studio Live Dashboard
stream_key = xxxx-xxxx-xxxx-xxxx-xxxx
# Primary ingest URL (RTMPS is encrypted; RTMP is standard)
# rtmps://a.rtmps.youtube.com:443/live2  or  rtmp://a.rtmp.youtube.com/live2
ingest_url = rtmps://a.rtmps.youtube.com:443/live2

[encoder]
# Video Codec:
#   libx264    - CPU encoding (compatible with all systems)
#   h264_qsv   - Intel QuickSync Video (Recommended for Intel Iris Xe / Core CPUs - ultra low CPU usage)
#   h264_nvenc - NVIDIA NVENC (NVIDIA GTX/RTX GPUs)
#   h264_amf   - AMD AMF (AMD Radeon GPUs)
video_codec      = h264_qsv
# Preset: veryfast (CPU) | veryfast (QSV) | p4 (NVENC) | speed (AMF)
preset           = veryfast
# Target frame rate (e.g. 24 or 30 fps)
fps              = 24
# YouTube requires keyframes at least every 2 seconds
keyframe_seconds = 2
# Video bitrate (e.g. 2500k for 1080p24, 4500k for 1080p60)
video_bitrate    = 2500k
# Audio bitrate (e.g. 128k AAC)
audio_bitrate    = 128k
# Canonical broadcast canvas (Width x Height). All cameras will be scaled & letterboxed into this canvas.
canvas           = 1920x1080

[switching]
# Default / Primary channel shown at startup and failback target
channel          = 1
# Switching mode:
#   off      - Stay on selected channel (auto-reconnect if it drops)
#   failover - If active channel drops, switch to next working channel; return when main recovers
#   rotate   - Continuously cycle through channels
mode             = rotate
# Dwell time per channel in rotate mode (seconds)
rotate_seconds   = 30
# Comma-separated list of channel numbers participating in failover / rotate
auto_channels    = 1,2,3,4,5,6,7,8
# Seconds without receiving new frames before marking channel as failed
failover_after   = 10
# In failover mode, interval (seconds) between attempts to return to the main channel
failback_seconds = 60

[audio]
# Send camera audio to YouTube (true) or stream silence (false)
enabled = true

[osd]
# Burn camera label and live clock into the video stream (true | false)
enabled      = false
show_channel = true
show_time    = true
font_size    = 22

[channel_names]
# Optional human-readable labels for your cameras.
# Used in GUI buttons, logging, and status displays.
# 1 = Front Gate
# 2 = Driveway
# 3 = Backyard
# 4 = Living Room
# 5 = Garage
# 6 = Front Porch
# 7 = Side Alley
# 8 = Roof Top

[tools]
# Leave empty to locate ffmpeg / ffprobe automatically from PATH or WinGet.
# Alternatively, provide full paths: C:\path\to\ffmpeg.exe
ffmpeg  = 
ffprobe = 

[resilience]
# RTSP socket timeout in seconds
rtsp_timeout    = 10
# Maximum seconds without output progress before reconnecting to YouTube
stall_timeout   = 30
# Exponential backoff parameters (seconds)
min_backoff     = 2
max_backoff     = 60
stable_after    = 60
status_interval = 60
